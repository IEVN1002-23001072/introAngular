<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="num1">Numero 1</label>
                            <input [(ngModel)]='num1' name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese el numero 1">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num2">Numero 2</label>
                            <input [(ngModel)]='num2' name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese el numero 2">
                        </div>
                        <br />
                        <div class="form-check">
                            <input [(ngModel)]="opcion" class="form-check-input" type="radio" name="operacion" id="sumar" value="sumar">
                            <label class="form-check-label" for="sumar">Sumar</label>
                        </div>
                        
                        <div class="form-check">
                            <input [(ngModel)]="opcion" class="form-check-input" type="radio" name="operacion" id="restar" value="restar">
                            <label class="form-check-label" for="restar">Restar</label>
                        </div>
                        
                        <div class="form-check">
                            <input [(ngModel)]="opcion" class="form-check-input" type="radio" name="operacion" id="dividir" value="dividir">
                            <label class="form-check-label" for="dividir">Dividir</label>
                        </div>
                        
                        <div class="form-check">
                            <input [(ngModel)]="opcion" class="form-check-input" type="radio" name="operacion" id="multiplicar" value="multiplicar">
                            <label class="form-check-label" for="multiplicar">Multiplicar</label>
                        </div>
                        <button (click)="operacion()" type="button" class="btn btn-primary">Calcular</button>
                        <!-- <button (click)="sumar()" type="button" class="btn btn-primary">Sumar</button>
                        <button (click)="restar()" type="button" class="btn btn-primary">Restar</button>
                        <button (click)="multiplicacion()" type="button" class="btn btn-primary">Multiplicar</button>
                        <button (click)="division()" type="button" class="btn btn-primary">Dividir</button> -->
                    </form>
                </div>
                <div class="col-6">
                    <h3>Resultado: {{resultado}} </h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
