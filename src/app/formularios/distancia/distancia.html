<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <h3>Cordenadas punto A X1 y Y1</h3>
                        <div class="form-group pt-4">
                            <label for="x1">Numero 1</label>
                            <input [(ngModel)]='x1' name="x1" type="number" class="form-control" id="x1" placeholder="Ingrese el punto x1">
                        </div>
                        
                        <div class="form-group pt-4">
                            <label for="y1">Numero 1</label>
                            <input [(ngModel)]='y1' name="y1" type="number" class="form-control" id="y1" placeholder="Ingrese el punto y1">
                        </div>
                        <br />
                        <h3>Cordenadas punto B X2 y Y2</h3>
                        <div class="form-group pt-4">
                            <label for="x2">Numero 2</label>
                            <input [(ngModel)]='x2' name="x2" type="number" class="form-control" id="x2" placeholder="Ingrese el punto x2">
                        </div>
                        
                        <div class="form-group pt-4">
                            <label for="y2">Numero 2</label>
                            <input [(ngModel)]='y2' name="y2" type="number" class="form-control" id="y2" placeholder="Ingrese el pinto y2">
                        </div>
                        <br />
                        
                        
                        <button (click)="distancia()" type="button" class="btn btn-primary">Calcular</button>
                    
                    </form>
                </div>
                <div class="col-6">
                    <h3>Resultado: {{resultado}} </h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
